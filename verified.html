<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>이메일 인증 완료 | 우리집 플래너</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:24px;background:#f6f7f9;color:#202124;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;
    }
    .card{
      width:min(100%,460px);background:#fff;border:1px solid #e7e9ed;
      border-radius:24px;padding:40px 28px;text-align:center;
      box-shadow:0 12px 40px rgba(0,0,0,.07);
    }
    .check{
      width:72px;height:72px;margin:0 auto 22px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      background:#e9f7ef;color:#198754;font-size:38px;font-weight:700;
    }
    h1{margin:0 0 14px;font-size:25px;line-height:1.35}
    p{margin:0;color:#62666d;font-size:16px;line-height:1.75}
    .app{font-weight:700;color:#30343a}
    .guide{
      margin-top:26px;padding:17px 16px;border-radius:14px;background:#f7f8fa;
      color:#42464d;font-size:15px;line-height:1.65;
    }
    .small{margin-top:24px;font-size:13px;color:#969ba3}
  </style>
</head>
<body>
  <main class="card">
    <div class="check">✓</div>
    <h1>이메일 인증이 완료되었습니다</h1>
    <p>
      <span class="app">우리집 플래너</span> 회원가입을 위한<br>
      이메일 인증이 정상적으로 완료되었습니다.
    </p>
    <div class="guide">
      이제 이 페이지를 닫고<br>
      <strong>우리집 플래너 앱으로 돌아가 로그인해 주세요.</strong>
    </div>
    <p class="small">이 페이지는 안전하게 닫으셔도 됩니다.</p>
  </main>
</body>
</html>
